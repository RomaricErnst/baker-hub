<div id="bh-six" class="viz-dotted-background" aria-label="Navigation directe Bakerhub">
<section aria-label="Navigation par activités"><div id="bh-expand" class="bh-stage"></div></section>

</div>
<style>
#bh-six .bh-stage{--p:light-dark(#fcfaf6,#26221d);--t:light-dark(#302a24,#f3eadb);--l:light-dark(#e2d9cd,#554a3c);--s:light-dark(#f1e7d8,#3b3025);--a:light-dark(#714b2b,#e3b98d);--on:light-dark(#fffaf3,#302115);color-scheme:light dark;color:var(--t);font:15px/1.5 system-ui,sans-serif;padding:12px 5px}
#bh-six .bh-stage *{box-sizing:border-box}#bh-six .phone{max-width:420px;margin:auto;background:var(--p);border:1px solid var(--l);border-radius:22px;overflow:hidden}#bh-six header{padding:15px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--l)}#bh-six .brand{font:bold 28px Georgia,serif;letter-spacing:-1px}#bh-six button{font:inherit;color:inherit;min-height:44px;background:none;border:0;border-radius:10px;padding:10px 12px}#bh-six button:focus-visible{outline:2px solid var(--a);outline-offset:2px}#bh-six h2{font:normal 29px/1.15 Georgia,serif;margin:4px 0 18px}#bh-six h3{font:normal 22px/1.25 Georgia,serif;margin:6px 0 12px}#bh-six p{margin:8px 0 16px}#bh-six small,#bh-six .small{font-size:12px}#bh-six .eyebrow{font-size:11px;letter-spacing:1px;text-transform:uppercase}#bh-six .context{padding:12px 18px;border-bottom:1px solid var(--l)}#bh-six .row{display:flex;align-items:center;justify-content:space-between;gap:8px}#bh-six .nav-toggle{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;padding:10px 18px;border-radius:0;border-bottom:1px solid var(--l)}#bh-six .nav-toggle strong{font-weight:500}#bh-six .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:10px;border-bottom:1px solid var(--l)}#bh-six .grid button{background:var(--s);border:1px solid var(--l);padding:10px 8px;display:flex;align-items:flex-start;text-align:left;flex-direction:column;gap:4px;min-width:0;font-size:14px}#bh-six .grid button small{font-size:11px;overflow-wrap:anywhere}#bh-six .grid button[aria-current=page]{background:var(--a);color:var(--on);border-color:var(--a)}#bh-six .grid svg{width:19px;height:19px}#bh-six .strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:0 8px;border-bottom:1px solid var(--l)}#bh-six .strip button{padding:12px 1px;border-radius:0;font-size:12px}#bh-six .strip button[aria-current=page]{background:var(--s);box-shadow:inset 0 -2px var(--a)}#bh-six main{padding:20px;min-height:425px}#bh-six .panel{padding:16px;background:var(--s);border-radius:14px;margin:12px 0}#bh-six .primary{background:var(--a);color:var(--on);width:100%;margin-top:16px}#bh-six .link{color:var(--a);text-decoration:underline;text-underline-offset:4px;padding:6px 0}#bh-six .pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}#bh-six .choice{border:1px solid var(--l);width:100%;text-align:left;padding:13px;margin:5px 0}#bh-six .choice[aria-pressed=true]{background:var(--s);border-color:var(--a)}#bh-six label.field{display:block;margin:16px 0}#bh-six label.field>span{display:block;margin-bottom:6px}#bh-six select,#bh-six input:not([type=checkbox]){font:16px system-ui,sans-serif;color:var(--t);background:var(--p);border:1px solid var(--l);border-radius:9px;padding:10px;min-height:44px;width:100%}#bh-six .check{display:flex;align-items:center;gap:12px;min-height:48px;border-bottom:1px solid var(--l)}#bh-six .check input{width:20px;height:20px;accent-color:var(--a);flex-shrink:0}#bh-six .check:has(input:checked) span{text-decoration:line-through;opacity:.6}#bh-six .setting{width:100%;border-bottom:1px solid var(--l);border-radius:0;display:flex;justify-content:space-between;text-align:left;padding:14px 0;gap:10px}#bh-six .setting small{display:block}#bh-six details{border-bottom:1px solid var(--l);padding:6px 0}#bh-six summary{min-height:44px;align-content:center}#bh-six footer{border-top:1px solid var(--l);padding:12px 18px;font-size:12px}#bh-six .mini-links{display:flex;gap:18px}#bh-six .quantity{font-variant-numeric:tabular-nums}#bh-six .return{margin-bottom:14px}@media(max-width:360px){#bh-six main{padding:16px}}
</style>
<script>
(()=>{const labels=['Ma fournée','Paramètres','Recette','Courses','Préparation','Cuisson & service'];const icons=['utensils','settings-2','book-open','shopping-basket','clipboard-list','flame'];
function init(id,variant){const root=document.getElementById(id);const s={page:0,ready:false,open:true,sub:null,type:'pizza',garnish:true,flavour:0,qty:4,oven:'Four à pizza',mix:'À la main',time:'19:30',checks:{},cooked:0,served:0,returnTo:null};const title=()=>s.type==='pizza'?'Pizza napolitaine':'Pain de campagne';const filling=()=>s.type==='pizza'?['Margherita','Champignons & mozzarella'][s.flavour]:['Avocat & œuf','Tomate & fromage frais'][s.flavour];const quantity=()=>s.type==='pizza'?s.qty+' pizzas':s.garnish?'1 pain · '+s.qty+' tartines':'1 pain';
const btn=(text,a,cls='')=>`<button class="${cls} cursor-interaction" data-action="${a}">${text}</button>`;
const go=(i,text,cls='')=>`<button class="${cls} cursor-interaction" data-go="${i}">${text}</button>`;
const choice=(key,val,text,active)=>`<button class="choice cursor-interaction" data-key="${key}" data-value="${val}" aria-pressed="${active}">${active?'✓ ':''}${text}</button>`;
const tick=(key,text)=>`<label class="check"><input type="checkbox" data-check="${key}" ${s.checks[key]?'checked':''}><span>${text}</span></label>`;
function navigate(i){s.page=i;s.sub=null;s.open=false;}
function render(){const statuses=['Pain, pizzas et garnitures','Pâte, matériel, préférences','Les quantités à peser','La liste à cocher','Horaires et gestes à suivre','Cuire, monter, servir'];const grid=()=>`<nav class="grid" aria-label="Toutes les destinations">${labels.map((l,i)=>`<button class="cursor-interaction" data-go="${i}" ${s.page===i?'aria-current="page"':''}><i data-lucide="${icons[i]}" aria-hidden="true"></i><span>${l}</span><small>${statuses[i]}</small></button>`).join('')}</nav>`;
let h=`<div class="phone"><header><span class="brand">bakerhub.</span><span class="small">Fournée d’exemple</span></header>`;
if(variant===3){if(!s.ready){h+=`<div class="context"><span class="eyebrow">Nouvelle fournée · ${s.page===0?'1. Votre menu':'2. Votre pâte'}</span><p class="small" style="margin:5px 0">${s.page===0?'Choisissez votre pain ou vos pizzas, puis les garnitures.':'Choisissez comment et quand préparer votre pâte.'}</p>${s.page===1?go(0,'← Revoir mon menu','link'):''}</div>`;}else{h+=`<div class="context"><strong>${title()}</strong><div class="small">${quantity()} · demain ${s.time}</div><div class="mini-links">${go(0,'Pain & garnitures','link')}${go(1,'Pâte & horaires','link')}</div></div>${s.page>=2?`<nav class="strip" aria-label="Activités">${labels.slice(2).map((l,i)=>`<button class="cursor-interaction" data-go="${i+2}" ${s.page===i+2?'aria-current="page"':''}>${i===3?'Cuire / servir':l}</button>`).join('')}</nav>`:''}`;}}else{h+=`<div class="context small">${title()} · ${quantity()}</div><button class="nav-toggle cursor-interaction" data-action="toggle" aria-expanded="${s.open}" aria-controls="${id}-destinations"><strong>${labels[s.page]}</strong><span class="small">${s.open?'Fermer ⌃':'Tout voir ▾'}</span></button><div id="${id}-destinations" ${s.open?'':'hidden'}>${grid()}</div>`;}
h+='<main>';
if(s.sub){h+=btn('← Retour '+(s.page===0?'à ma fournée':'aux paramètres'),'back','link return');if(s.sub==='filling'){h+=`<h2>${s.type==='pizza'?'Vos garnitures.':'Vos tartines.'}</h2><p class="small">Sur votre ${title().toLowerCase()}.</p>`;h+=choice('flavour',0,s.type==='pizza'?'Margherita':'Avocat & œuf',s.flavour===0)+choice('flavour',1,s.type==='pizza'?'Champignons & mozzarella':'Tomate & fromage frais',s.flavour===1)+btn(s.returnTo===4?'Valider et reprendre la préparation':'Garder cette garniture',s.returnTo===4?'return':'back','primary');}if(s.sub==='equipment')h+=`<h2>Votre équipement.</h2><label class="field"><span>Four</span><select data-field="oven">${['Four à pizza','Four domestique','Four à bois'].map(v=>`<option ${s.oven===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="field"><span>Pétrissage</span><select data-field="mix">${['À la main','Robot pétrisseur'].map(v=>`<option ${s.mix===v?'selected':''}>${v}</option>`).join('')}</select></label>${btn('Valider l’équipement','back','primary')}`;if(s.sub==='time')h+=`<h2>À quelle heure ?</h2><label class="field"><span>Service demain</span><input type="time" data-field="time" value="${s.time}"></label><p class="small">Le planning de fermentation serait recalculé dans l’application.</p>${btn('Garder cet horaire','back','primary')}`;
}else if(s.page===0){h+=`<h2>Qu’est-ce qu’on mange ?</h2><div class="pair">${choice('type','pizza','Pizza',s.type==='pizza')}${choice('type','bread','Pain',s.type==='bread')}</div><div class="panel"><span class="eyebrow">Style de cet exemple</span><h3>${title()}</h3></div><p>Avec des garnitures ?</p><div class="pair">${choice('garnish','yes','Oui',s.garnish)}${choice('garnish','no','Pâte seule',!s.garnish)}</div>${s.garnish?btn('<span>'+filling()+'<small>Choisir ou modifier</small></span><span>›</span>','filling','setting'):''}<label class="field"><span>${s.type==='pizza'?'Nombre de pizzas':s.garnish?'Tartines avec cette miche':'Nombre de pains'}</span><select data-field="qty">${(s.type==='bread'&&!s.garnish?[1]:[2,4,6]).map(n=>`<option ${s.qty===n?'selected':''}>${n}</option>`).join('')}</select></label>${s.returnTo!==null?btn('Appliquer et revenir à '+labels[s.returnTo].toLowerCase(),'return','primary'):go(1,'Personnaliser ma fournée →','primary')}`;
}else if(s.page===1){h+=`<h2>Paramètres de la fournée.</h2><p class="small">Personnalisez la pâte, votre matériel et les horaires.</p><span class="eyebrow">Mode simple · valeurs conseillées</span>${btn('<span>Équipement<small>'+s.oven+' · '+s.mix+'</small></span><span>›</span>','equipment','setting')}${btn('<span>Horaire<small>Demain à '+s.time+'</small></span><span>›</span>','time','setting')}<details><summary>Préférences de pâte & températures</summary><p class="small">Farine, levure ou levain, hydratation et températures rejoindront les pages détaillées. Ces réglages concernent cette fournée.</p></details><div class="panel"><span class="eyebrow">Au menu</span><p>${title()}<br>${s.garnish?filling():'Pâte seule'}</p></div>${s.returnTo!==null?btn('Appliquer et revenir à '+labels[s.returnTo].toLowerCase(),'return','primary'):go(2,s.ready?'Revenir à ma recette →':'Créer ma recette →','primary')}`;
}else if(s.page===2){h+=`<span class="eyebrow">${quantity()}</span><h2>Votre recette.</h2><div class="panel"><h3>${title()}</h3><p>${s.type==='pizza'?'Farine · eau · sel · levure':'Blé · seigle · eau · sel · levain'}</p><span class="small">Grammages calculés dans la version complète.</span></div><div class="row"><div><span class="eyebrow">${s.type==='pizza'?'Garnitures':'Tartines'}</span><p>${s.garnish?filling():'Pâte seule'}</p></div>${btn('Modifier','editchoices','link')}</div>${go(3,'Voir mes courses','primary')}${go(4,'Retrouver le protocole →','link')}`;
}else if(s.page===3){h+=`<h2>Mes courses.</h2><span class="eyebrow">Pour la pâte</span>${tick('shop-flour','Farine')}${tick('shop-salt','Sel')}${tick('shop-yeast',s.type==='pizza'?'Levure':'Levain')}${s.garnish?`<div class="row" style="margin-top:18px"><span class="eyebrow">${filling()}</span>${btn('Modifier','editchoices','link')}</div>${(s.type==='pizza'?(s.flavour===0?['Tomate','Mozzarella','Basilic']:['Champignons','Mozzarella']):(s.flavour===0?['Avocat','Œufs','Citron']:['Tomates','Fromage frais'])).map(x=>tick('shop-'+x,x)).join('')}`:''}${go(4,'Commencer la préparation →','primary')}`;
}else if(s.page===4){h+=`<h2>Suivre la préparation.</h2><div class="panel"><div class="row"><span>À table demain</span><strong>${s.time}</strong></div>${btn('Modifier les horaires','editsettings','link')}</div><details open><summary>Préparer la pâte</summary>${tick('mix','Mélanger et pétrir')}${tick('shape',s.type==='pizza'?'Diviser les pâtons':'Façonner le pain')}<p class="small">Les temps de fermentation seraient indiqués ici.</p></details>${s.garnish?`<details open><summary>Préparer les garnitures</summary>${tick('prep-'+filling(),'Préparer les ingrédients de '+filling().toLowerCase())}</details>`:`<div class="panel"><h3>${s.type==='pizza'?'Et sur vos pizzas ?':'Envie de tartines ?'}</h3><p class="small">Vous pouvez choisir les garnitures maintenant, ou continuer sans.</p>${btn(s.type==='pizza'?'Choisir mes pizzas →':'Choisir mes tartines →','addfillings','link')}</div>`}${go(5,'Passer à la cuisson & au service →','primary')}`;
}else{h+=`<h2>Cuisson & service.</h2>${s.type==='pizza'?`<div class="panel"><span class="eyebrow">File de cuisson</span><h3>${s.cooked} / ${s.qty} pizzas cuites</h3><p>${s.garnish?filling():'Garniture libre'}</p>${s.cooked<s.qty?btn('Pizza '+(s.cooked+1)+' cuite','cook','primary'):'<p>La fournée est prête.</p>'}${s.cooked?btn('Annuler la dernière','undo','link'):''}</div>`:`<details open><summary>Cuire et refroidir le pain</summary>${tick('baked','Pain cuit')}${tick('cooled','Pain refroidi')}</details>${s.garnish?`<div class="panel"><span class="eyebrow">Montage & service</span><h3>${s.served} / ${s.qty} tartines servies</h3><p>${filling()}</p>${s.served<s.qty?btn('Une tartine servie','serve','primary'):'<p>Tout est servi.</p>'}${s.served?btn('Annuler la dernière','undo','link'):''}</div>`:'<p>Votre pain est prêt à partager.</p>'}`}`;}
if(!s.sub&&s.page>0&&s.returnTo===null)h+=go(s.page-1,'← '+labels[s.page-1],'link');h+='</main><footer role="status" aria-live="polite">Exemple simplifié · aucun calcul ni enregistrement réel</footer></div>';root.innerHTML=h;if(globalThis.lucide)globalThis.lucide.createIcons();}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.go!==undefined){const to=+d.go;s.returnTo=s.page>=2&&to<2?s.page:null;if(to===2&&s.page===1)s.ready=true;navigate(to);}else if(d.key){if(d.key==='type'){s.type=d.value;s.oven=s.type==='pizza'?'Four à pizza':'Four domestique';s.qty=s.type==='bread'&&!s.garnish?1:4;s.flavour=0;s.cooked=0;s.served=0;s.checks={};}if(d.key==='garnish'){s.garnish=d.value==='yes';s.qty=s.type==='bread'&&!s.garnish?1:4;}if(d.key==='flavour'){s.flavour=+d.value;s.cooked=0;s.served=0;}}else{const a=d.action;if(a==='toggle')s.open=!s.open;if(['filling','equipment','time'].includes(a))s.sub=a;if(a==='back')s.sub=null;if(a==='addfillings'){s.returnTo=s.page;navigate(0);s.garnish=true;if(s.qty===1)s.qty=4;s.sub='filling';}if(a==='editchoices'||a==='editsettings'){s.returnTo=s.page;navigate(a==='editchoices'?0:1);}if(a==='return'){navigate(s.returnTo??2);s.returnTo=null;}if(a==='cook')s.cooked=Math.min(s.qty,s.cooked+1);if(a==='serve')s.served=Math.min(s.qty,s.served+1);if(a==='undo'){if(s.type==='pizza')s.cooked=Math.max(0,s.cooked-1);else s.served=Math.max(0,s.served-1);}}render();});
root.addEventListener('change',e=>{const d=e.target.dataset;if(d.check){s.checks[d.check]=e.target.checked;render();return;}if(d.field){s[d.field]=d.field==='qty'?+e.target.value:e.target.value;s.cooked=Math.min(s.cooked,s.qty);s.served=Math.min(s.served,s.qty);render();}});render();}
init('bh-expand',1);
})();
</script>
